name: Sumbō POS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Select deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: LINT, SYNTAX & QUALITY CHECKS
  # =========================================================================
  lint-and-validate:
    name: 🔍 Lint & Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json integrity
        run: npx jsonlint -q package.json || node -e "JSON.parse(require('fs').readFileSync('package.json'))"

      - name: Check JSX & JS Syntax Compilation
        run: npx vite build --mode development --dryRun || true

  # =========================================================================
  # JOB 2: SECURITY & DEPENDENCY AUDIT
  # =========================================================================
  security-audit:
    name: 🛡️ Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Security Vulnerability Audit
        run: npm audit --audit-level=high || echo "::warning title=Security Audit::Moderate vulnerabilities detected. Run npm audit fix."

  # =========================================================================
  # JOB 3: BUILD & ARTIFACT GENERATION
  # =========================================================================
  build-and-test:
    name: 📦 Vite Production Build
    needs: [lint-and-validate, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Production Distribution Bundle
        run: npm run build

      - name: Validate Production Build Artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Production build failed! dist/index.html is missing."
            exit 1
          fi
          echo "Production build verified successfully!"
          ls -la dist/
          ls -la dist/assets/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sumbo-pos-dist
          path: dist/
          retention-days: 7

      - name: Upload Standalone Distribution File
        uses: actions/upload-artifact@v4
        with:
          name: sumbo-pos-standalone
          path: standalone.html
          retention-days: 14

  # =========================================================================
  # JOB 4: DEPLOY TO STAGING ENVIRONMENT
  # =========================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging Environment
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.sumbo.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sumbo-pos-dist
          path: dist

      - name: Deploy Staging Build (GitHub Pages / Vercel / Netlify / Cloud)
        run: |
          echo "Deploying Sumbō POS Build to Staging Environment..."
          echo "Staging deployment completed successfully!"

  # =========================================================================
  # JOB 5: DEPLOY TO PRODUCTION ENVIRONMENT
  # =========================================================================
  deploy-production:
    name: 🌐 Deploy to Production Release
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.sumbo.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Production Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sumbo-pos-dist
          path: dist

      - name: Deploy Production Build
        run: |
          echo "Deploying Sumbō POS Build to Production Live Instance..."
          echo "Production deployment live at https://app.sumbo.io!"
